name: Android verification
on:
  push:
    branches: [main, feature/android-production-readiness]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clean
        run: ./gradlew clean
      - name: Debug, tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Unsigned optimized release verification
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace
      - name: Artifact integrity
        run: |
          python3 scripts/verify_release_artifacts.py
      - name: Reports and verification artifacts (unsigned release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.sha }}
          retention-days: 14
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/
            app/build/outputs/artifact-sha256.txt
