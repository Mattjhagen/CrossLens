<svg viewBox="0 0 400 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone frame - dark graphite with subtle details -->
  <defs>
    <linearGradient id="frame-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen-reflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.03" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="frame-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen-clip">
      <rect x="10" y="10" width="380" height="800" rx="32"/>
    </clipPath>
  </defs>

  <!-- Outer frame with subtle shadow -->
  <rect x="0" y="0" width="400" height="820" rx="44" fill="url(#frame-edge)" filter="url(#frame-shadow)"/>

  <!-- Inner bezel -->
  <rect x="8" y="8" width="384" height="804" rx="38" fill="#1d1d1f" stroke="#2a2a2d" stroke-width="0.5"/>

  <!-- Screen area (where screenshot goes) -->
  <rect x="10" y="10" width="380" height="800" rx="32" fill="#000"/>

  <!-- Speaker cutout -->
  <rect x="150" y="20" width="100" height="3" rx="1.5" fill="#0a0a0a" opacity="0.8"/>

  <!-- Camera -->
  <circle cx="270" cy="21.5" r="5" fill="#0a0a0a" opacity="0.8"/>
  <circle cx="270" cy="21.5" r="2.5" fill="#1a2a3a" opacity="0.6"/>

  <!-- Screen reflection overlay -->
  <rect x="10" y="10" width="380" height="800" rx="32" fill="url(#screen-reflection)" opacity="0.4"/>

  <!-- Frame highlight edge -->
  <rect x="8.5" y="8.5" width="383" height="803" rx="37.5" fill="none" stroke="#3a3a3d" stroke-width="0.5" opacity="0.3"/>
</svg>
