<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CrossLens icon: overlapping perspective circles representing multiple viewpoints -->
  <defs>
    <linearGradient id="lens-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2997ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="50" fill="#1a1a1d"/>

  <!-- Left lens (partial circle) -->
  <circle cx="38" cy="50" r="22" fill="none" stroke="url(#lens-gradient)" stroke-width="3.5" opacity="0.85"/>

  <!-- Right lens (partial circle, overlapping) -->
  <circle cx="62" cy="50" r="22" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.75"/>

  <!-- Center intersection glow -->
  <circle cx="50" cy="50" r="8" fill="url(#lens-gradient)" opacity="0.9"/>
  <circle cx="50" cy="50" r="5" fill="#ffffff" opacity="0.95"/>
</svg>
